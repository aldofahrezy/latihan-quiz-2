{% extends "base.html" %}
{% block title %}Catatan Belajar{% endblock %}
{% block content %}
<section class="card">
  <h1>Catatan Belajar</h1>
  {% if user.is_authenticated %}
    <p>Halo, {{ user.username }}.</p>
    <p><a href="{% url 'main:show_notes' %}">Catatan (JavaScript)</a> · <a href="{% url 'main:show_notes_htmx' %}">Catatan (HTMX)</a> · <a href="{% url 'main:logout' %}">Logout</a></p>
  {% else %}
    <p><a href="{% url 'main:login' %}">Login</a> · <a href="{% url 'main:register' %}">Registrasi</a></p>
  {% endif %}
</section>
{% endblock %}
